name: CI Pipeline (forks)

on:
  pull_request_target:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: fork ci
    if: github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/ci-pipeline-jobs.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha }}
      environment: forks-ci
    secrets:
      OIDC_TEST_CONFIG_1_B64: ${{ secrets.OIDC_TEST_CONFIG_1_B64 }}
